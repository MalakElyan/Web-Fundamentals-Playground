<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <style>

    
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center; /* توسيط أفقي */
            align-items: center;     /* توسيط عمودي */
            height: 100vh;           
            margin: 0;
            font-family: Arial;
        }

        .card {
            width: 300px;
            background: white;
            margin: auto;
            padding-bottom: 20px;
            border: 0px solid #ccc;
            text-align: left;     /* محاذاة النص لليسار */
            border-radius: 10px; /* حواف دائرية للكرت */
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* ظل*/
        }

        .content {
            padding: 0 20px;
        }

        .avatar {
            width: 100%;
            height: 200px;
            object-fit: cover;      
            object-position: center;
            display: block;
        }


        h2 {
            margin-top: 20px;
            margin-bottom: 5px;
            color: #333;
        }

        p {
            color: gray;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .tags {
            display: flex;
            gap: 10px;               /* مسافة بين الأزرار */
            margin-bottom: 20px;
        }

        .tag {
            padding: 4px 10px;  
            border-radius: 20px; 
            font-size: 13px;
            font-weight: bold;
        }

        .tag-web { background-color: #c3fae8; color: #0ca678; }    
        .tag-ui  { background-color: #d0ebff; color: #1971c2; }    
        .tag-design { background-color: #f3d9fa; color: #ae3ec9; } 

        .btn {
            display: inline-block;
            color: #bdc2c8;          
            text-decoration: none;  
            font-size: 14px;
            transition: 0.3s;
        }

        .btn:hover {
            background: darkblue;
            transform: scale(1.1);
        }

    </style>
</head>

<body>

<div class="card">
    <img src="JJJJ.png" class="avatar">
    <div class="content">
    <h2>John Doe</h2>
    <p>Front-end Developer</p>

    <div class="tags">
            <span class="tag tag-web">Web</span>
            <span class="tag tag-ui">UI/UX</span>
            <span class="tag tag-design">Design</span>
        </div>
    <a href="#" class="btn">View Profile</a>
</div>
</div>
</body>
</html>
